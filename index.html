<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Providence ❤️</title>

<style>

*{
box-sizing:border-box;
font-family:"Arial",sans-serif;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#ff758c,#ffb199);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.heart{
position:absolute;
font-size:35px;
opacity:.12;
animation:float 8s infinite;
}

.card{
background:white;
width:100%;
max-width:550px;
padding:35px;
border-radius:35px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.2);
animation:fade .5s;
}

h1{
color:#ff4d6d;
font-size:32px;
}

h2{
color:#ff4d6d;
}

p{
font-size:18px;
line-height:1.6;
color:#333;
}

.emoji{
font-size:70px;
}

button{
border:none;
padding:16px 25px;
margin:10px;
border-radius:40px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.07);
}

.main{
background:#ff4d6d;
color:white;
}

.choice{
display:block;
width:90%;
margin:12px auto;
background:#fff0f3;
border:2px solid #ff4d6d;
color:#333;
}

textarea{
width:90%;
height:100px;
border-radius:20px;
border:2px solid #ff4d6d;
padding:15px;
font-size:16px;
resize:none;
}


@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}


@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100vh);
}
}

</style>

</head>


<body>


<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:50%;animation-delay:2s">❤️</div>
<div class="heart" style="left:80%;animation-delay:4s">❤️</div>



<div class="card" id="app">

<div class="emoji">✨</div>

<h1>Providence ❤️</h1>

<p>

Avant qu’on reprenne nos petites séances à la salle ce lundi 😄,

<br><br>

je me suis rappelé de deux idées qu’on avait lancées comme ça...

<br><br>

Une soirée avec des frissons 👻

<br>

ou une aventure avec un peu de courage 🌊

<br><br>

Alors, quelle aventure on tente ? 😌

</p>


<button class="main" onclick="start()">
Commencer 🎯
</button>


</div>



<script>


let app=document.getElementById("app");

let activite="";
let choix="";
let apres="";
let jour="";
let heure="";
let message="";



function start(){

app.innerHTML=`

<div class="emoji">🎯</div>

<h1>Choisis notre aventure</h1>

<p>
On avait parlé de deux idées...
<br><br>
Laquelle te tente le plus ?
</p>


<button class="choice" onclick="cinema()">

🎬 Mission cinéma

<br><br>

👻 Film d'horreur + popcorn

</button>



<button class="choice" onclick="paddle()">

🌊 Mission paddle

<br><br>

🏄 Petit défi aventure

</button>

`;

}




function cinema(){

activite="🎬 Cinéma";


app.innerHTML=`

<div class="emoji">👻</div>

<h1>Nuit de frissons</h1>

<p>

On s’était dit :

<br><br>

<b>
"Un de ces quatre on ira voir un film d’horreur"
</b>

</p>

<p>
Maintenant il faut choisir notre film 😈
</p>


<button class="choice" onclick="filmChoice('Evil Dead Burn - Pathé Palace')">

👻 Evil Dead Burn

<br>

Pathé Palace

<br><br>

Pour une vraie dose de frissons

</button>



<button class="choice" onclick="filmChoice('Nightborn - UGC')">

🌙 Nightborn

<br>

UGC

<br><br>

Pour une ambiance sombre et mystérieuse

</button>

`;

}




function filmChoice(value){

choix=value;

afterActivity();

}





function paddle(){

activite="🌊 Paddle";


app.innerHTML=`

<div class="emoji">🏄</div>

<h1>Défi paddle</h1>


<p>

Petit rappel 😂

<br><br>

Tu m'avais avoué avoir une petite appréhension avec l’eau...

</p>


<p>

Mais peut-être qu’on va réussir à devenir des pros du paddle 🌊😄

</p>


<p>

Quel mode de courage aujourd’hui ?

</p>



<button class="choice" onclick="paddleChoice('🛟 Mode découverte')">

🛟 Mode découverte

<br>

On profite tranquillement

</button>


<button class="choice" onclick="paddleChoice('💪 Mode aventurier')">

💪 Mode aventurier

<br>

On tente vraiment

</button>


<button class="choice" onclick="paddleChoice('😂 Mode confiance')">

😂 Mode confiance

<br>

Je compte sur toi

</button>

`;

}




function paddleChoice(value){

choix=value;

afterActivity();

}




function afterActivity(){


app.innerHTML=`

<div class="emoji">😌</div>


<h1>Après la sortie...</h1>


<p>

Bon... une fois la mission terminée,

<br>

il faut bien prolonger un peu le moment 😄

</p>


<p>

On fait quoi après ?

</p>


<button class="choice" onclick="afterChoice('🍔 Manger un bon truc')">

🍔 Manger un bon truc

</button>


<button class="choice" onclick="afterChoice('🍦 Glace + balade')">

🍦 Glace et balade

</button>


<button class="choice" onclick="afterChoice('☕ Boire quelque chose et discuter')">

☕ Se poser et discuter

</button>


<button class="choice" onclick="afterChoice('✨ Surprise')">

✨ Je te laisse choisir

</button>

`;

}




function afterChoice(value){

apres=value;


if(activite.includes("Cinéma")){

dateCinema();

}else{

datePaddle();

}

}




function dateCinema(){

app.innerHTML=`

<div class="emoji">🎬</div>

<h1>Quand on lance ça ?</h1>

<p>
Quel moment te conviendrait ?
</p>


<button class="choice" onclick="chooseDay('Vendredi soir')">

📅 Vendredi soir

</button>


<button class="choice" onclick="chooseDay('Samedi soir')">

📅 Samedi soir

</button>


<button class="choice" onclick="chooseDay('Dimanche soir')">

📅 Dimanche soir

</button>

`;

}





function datePaddle(){

app.innerHTML=`

<div class="emoji">🌊</div>

<h1>Quand partir à l’aventure ?</h1>

<p>
Quel moment serait parfait ?
</p>


<button class="choice" onclick="chooseDay('Samedi matin')">

☀️ Samedi matin

</button>


<button class="choice" onclick="chooseDay('Samedi après-midi')">

🌤️ Samedi après-midi

</button>


<button class="choice" onclick="chooseDay('Dimanche après-midi')">

🌤️ Dimanche après-midi

</button>

`;

}





function chooseDay(value){

jour=value;


app.innerHTML=`

<div class="emoji">🕒</div>

<h1>Dernier détail</h1>

<p>
Quelle heure ?
</p>


<button class="choice" onclick="finish('14h')">

🕑 14h

</button>


<button class="choice" onclick="finish('16h')">

🕓 16h

</button>


<button class="choice" onclick="finish('20h')">

🕗 20h

</button>

`;

}





function finish(value){

heure=value;


app.innerHTML=`

<div class="emoji">💌</div>


<h1>Une dernière chose...</h1>


<p>

Une idée, une envie ou une remarque pour rendre cette sortie encore mieux ? 😄

</p>


<textarea id="msg" placeholder="Écris-moi ton idée ❤️"></textarea>


<br>


<button class="main" onclick="send()">

Valider ❤️

</button>

`;

}




function send(){


message=document.getElementById("msg").value;


fetch("https://formspree.io/f/mjgnqjba",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

Prenom:"Providence",

Activite:activite,

Choix:choix,

Apres:apres,

Jour:jour,

Heure:heure,

MessageLibre:message,

Date:new Date().toLocaleString("fr-FR")

})

});



app.innerHTML=`

<div class="emoji">🎉❤️</div>


<h1>Mission validée !</h1>


<p>

Voilà notre programme :

</p>


<h2>${activite}</h2>


<p>

${choix}

<br><br>

${apres}

<br><br>

📅 ${jour}

<br>

🕒 ${heure}

</p>


<p>

Maintenant il ne reste plus qu’à profiter 😄❤️

</p>


<p>

À bientôt Providence

</p>

`;

}


</script>


</body>

</html>
