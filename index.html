<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une petite mission ❤️</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card {
    background:white;
    width:100%;
    max-width:500px;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    animation:appear .6s ease;
}

h1 {
    color:#ff4d6d;
}

p {
    font-size:18px;
    line-height:1.5;
}

button {
    border:none;
    padding:15px 25px;
    margin:8px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    background:#ff4d6d;
    color:white;
    transition:.3s;
}

button:hover {
    transform:scale(1.05);
}

.choice {
    background:#f8f8f8;
    color:#333;
    border:2px solid #ff4d6d;
}

.heart {
    font-size:60px;
}

@keyframes appear {
    from {
        opacity:0;
        transform:translateY(30px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="card" id="app">

<div class="heart">👀</div>

<h1>Mission surprise</h1>

<p>
J'ai préparé un petit truc pour toi.<br>
Ça prend seulement quelques secondes 😄
</p>

<button onclick="start()">Commencer</button>

</div>


<script>

let app = document.getElementById("app");


function start(){

app.innerHTML = `
<h1>Petite question 😏</h1>

<p>
On passe déjà pas mal de temps ensemble à faire du sport...
</p>

<p>
Mais je me suis dit qu'on pourrait peut-être faire une activité où on ne finit pas complètement fatigués 😂
</p>

<button onclick="next1()">Continuer</button>
`;

}


function next1(){

app.innerHTML = `
<h1>Choisis ta mission 🎯</h1>

<p>
Qu'est-ce qui te tenterait le plus ?
</p>

<button class="choice" onclick="next2('🎬 Film')">
🎬 Regarder un film
</button>

<button class="choice" onclick="next2('🍝 Restaurant')">
🍝 Aller manger quelque part
</button>

<button class="choice" onclick="next2('🍦 Glace / balade')">
🍦 Glace et balade
</button>

`;

}


let choix="";


function next2(c){

choix=c;

app.innerHTML = `
<h1>Très bon choix 😌</h1>

<p>
Donc notre prochaine mission serait :
</p>

<h2>${choix}</h2>

<p>
Maintenant la vraie question...
</p>

<button onclick="final()">Découvrir ❤️</button>

`;

}


function final(){

app.innerHTML = `
<div class="heart">❤️</div>

<h1>Alors...</h1>

<p>
Est-ce qu'on transforme enfin notre
<br><b>"on sort un de ces quatre"</b>
<br>
en vraie sortie ? 😄
</p>

<button onclick="yes()">
Avec plaisir ❤️
</button>

`;

}


function yes(){

app.innerHTML = `
<div class="heart">🎉</div>

<h1>Mission réussie !</h1>

<p>
J'avoue, j'espérais cette réponse 😄
</p>

<p>
On n'a plus qu'à choisir le jour et profiter du moment.
</p>

<p>
À bientôt 😊❤️
</p>
`;

}

</script>

</body>
</html>
