<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Providence ❤️</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ffb199);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.heart{
    position:absolute;
    font-size:35px;
    opacity:0.15;
    animation:float 8s infinite;
}

.card{
    background:white;
    width:100%;
    max-width:520px;
    padding:35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
    animation:fade .5s ease;
}

h1{
    color:#ff4d6d;
    font-size:32px;
}

h2{
    color:#ff4d6d;
}

p{
    color:#333;
    font-size:18px;
    line-height:1.6;
}

.emoji{
    font-size:65px;
}

button{
    border:none;
    padding:15px 25px;
    margin:10px;
    border-radius:40px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

.main{
    background:#ff4d6d;
    color:white;
}

.choice{
    display:block;
    width:90%;
    margin:12px auto;
    background:#fff0f3;
    border:2px solid #ff4d6d;
    color:#333;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}

</style>

</head>


<body>


<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:50%;animation-delay:2s">❤️</div>
<div class="heart" style="left:80%;animation-delay:4s">❤️</div>



<div class="card" id="app">


<div class="emoji">👀</div>

<h1>Providence ❤️</h1>

<p>
J'ai préparé une petite mission pour toi.
<br><br>
Objectif : arrêter de dire "un de ces quatre" 😄
</p>

<button class="main" onclick="start()">
Commencer 🎯
</button>


</div>




<script>


let app=document.getElementById("app");


let activite="";
let film="";
let jour="";
let heure="";



function start(){


app.innerHTML=`

<div class="emoji">🎬</div>

<h1>Première mission</h1>


<p>
On s'était dit un jour :
</p>


<p>
<b>
"Un de ces quatre on ira au cinéma voir un film d'horreur"
</b>
👻
</p>


<p>
Mais il reste un problème...
<br>
On n'a toujours pas choisi lequel 😂
</p>


<button class="main" onclick="filmQuestion()">
Choisir le film
</button>

`;

}




function filmQuestion(){


app.innerHTML=`

<div class="emoji">👻</div>

<h1>Question horreur</h1>


<p>
Quel genre de film tu préfères ?
</p>


<button class="choice" onclick="selectFilm('Film qui fait vraiment peur 😱')">
😱 Celui qui fait vraiment peur
</button>


<button class="choice" onclick="selectFilm('Film horreur + humour 😂')">
😂 Celui où on rigole aussi
</button>


<button class="choice" onclick="selectFilm('Film impossible seul 🙈')">
🙈 Celui qui fait regretter
</button>

`;

}




function selectFilm(value){


film=value;


app.innerHTML=`

<div class="emoji">🌊</div>

<h1>Deuxième mission</h1>


<p>
On avait aussi parlé de faire du paddle 🏄
</p>


<p>
Mais il y avait un petit détail...
<br>
Tu m'avais dit avoir peur de l'eau 😅
</p>


<p>
Alors, on tente ?
</p>


<button class="choice" onclick="activity('🎬 Cinéma film d’horreur')">
🎬 Je vote cinéma
</button>


<button class="choice" onclick="activity('🏄 Paddle aventure')">
🏄 Je tente le paddle
</button>


`;

}





function activity(value){


activite=value;


app.innerHTML=`

<div class="emoji">📅</div>


<h1>Mission organisation</h1>


<p>
Maintenant on arrête de dire "un de ces quatre" 😄
</p>


<p>
Quel moment te conviendrait ?
</p>


<button class="choice" onclick="chooseDay('Vendredi soir')">
📅 Vendredi soir
</button>


<button class="choice" onclick="chooseDay('Samedi soir')">
📅 Samedi soir
</button>


<button class="choice" onclick="chooseDay('Dimanche')">
📅 Dimanche
</button>

`;

}





function chooseDay(value){


jour=value;


app.innerHTML=`

<div class="emoji">🕒</div>


<h1>Dernier choix</h1>


<p>
Quelle heure serait idéale ?
</p>


<button class="choice" onclick="finish('18h')">
🕕 18h
</button>


<button class="choice" onclick="finish('20h')">
🕗 20h
</button>


<button class="choice" onclick="finish('21h')">
🕘 21h
</button>


`;

}





function finish(value){


heure=value;



fetch("https://formspree.io/f/mjgnqjba",{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({


Prenom:"Providence",

FilmChoisi:film,

Activite:activite,

Jour:jour,

Heure:heure,

Message:"Mission validée ❤️",

Date:new Date().toLocaleString("fr-FR")


})


});




app.innerHTML=`

<div class="emoji">🎉❤️</div>


<h1>Mission validée !</h1>


<p>
Voilà le programme :
</p>


<h2>${activite}</h2>


<p>
🎬 ${film}
<br><br>
📅 ${jour}
<br>
🕒 ${heure}
</p>


<p>
Maintenant il reste juste à organiser ça 😄
</p>


<p>
À bientôt Providence ❤️
</p>


`;

}



</script>


</body>

</html>
